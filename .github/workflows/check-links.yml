name: Check Links

on:
  push:
    branches: [main]

jobs:
  check-links:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install lychee
        run: cargo install lychee

      - name: Run link check
        run: lychee --verbose --no-progress --include-mail docs/**/*.md
