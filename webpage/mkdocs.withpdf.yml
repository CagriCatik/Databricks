theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.sections       # enables grouped, collapsible sections
    - navigation.indexes        # treats index.md inside a section as its landing page
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - header.autohide
    - header.autohide
    - toc.follow
    - palette.toggle
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: amber
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: amber
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
extra:
  copyright: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/CagriCatik/Power-BI

extra_css:
  - styles/extra.css

plugins:
  - search
  - with-pdf
