theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.sections
    - navigation.indexes
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - header.autohide
    - toc.follow
    - palette.toggle
    - content.image.zoom
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red       # Databricks red (exact hex in extra.css)
      accent: orange     # Databricks orange (exact hex in extra.css)
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra:
  copyright: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/CagriCatik/Databricks

extra_css:
  - styles/extra.css

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
